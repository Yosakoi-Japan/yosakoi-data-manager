name: Sync Events

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write credentials file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/google-service-account.json" >> "$GITHUB_ENV"

      - name: Run sync
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET: ${{ secrets.GOOGLE_WORKSHEET }}
        run: |
          ./gradlew run --args="--sheet-id $GOOGLE_SHEET_ID --worksheet $GOOGLE_WORKSHEET"

      - name: Checkout yosakoiPortal
        uses: actions/checkout@v4
        with:
          repository: Yosakoi-Japan/yosakoiPortal
          token: ${{ secrets.YOSAKOI_PORTAL_PAT }}
          path: yosakoiPortal

      - name: Copy generated CSV to frontend
        run: |
          cp ./yosakoi_festival.csv ./yosakoiPortal/frontend/app/src/assets/data/yosakoi_event.csv

      - name: Commit frontend CSV
        working-directory: ./yosakoiPortal
        run: |
          if [ -z "$(git status --short -- frontend/app/src/assets/data/yosakoi_event.csv)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/src/assets/data/yosakoi_event.csv
          git commit -m "chore: sync frontend yosakoi_event csv"
          git push
